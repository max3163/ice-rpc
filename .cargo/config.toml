# Cargo aliases for the ice-rpc workspace examples.
#
# The demo apps live in `ice-rpc/examples` and require the `tokio` feature at
# build time, so a plain `cargo run --example provider-app` fails. These aliases
# wire the right features:
#
#   cargo provider            # provider-app, debug
#   cargo consumer            # consumer-app, debug (database by default)
#   cargo consumer -- --service context
#   cargo state               # state_service, debug
#   cargo http-consumer       # consumer-http-app, debug
#   cargo provider-http       # provider-app with the HTTP gateway, debug
#   cargo bench-app           # benchmark-app, release
#   cargo probe               # C7 native-liveness probe, debug
#   cargo monitoring          # out-of-band observer, stats only
#   cargo monitoring-detail   # observer, decoded request/response per call
#   cargo monitoring-demo     # observer, self-contained demo (--demo --detail)
#   cargo monitoring-serve    # observer binary, Prometheus endpoint on :9898
#
# `-release` variants build with optimisations, `provider-size` with the
# size-first `size` profile (see `docs/binary-size.md`).
[alias]
provider = "run -p ice-rpc --example provider-app --features tokio"
provider-release = "run -p ice-rpc --release --example provider-app --features tokio"
provider-http = "run -p ice-rpc --example provider-app --features=tokio,http-tokio"
# Same app, built for the smallest possible image (`opt-level = "z"`, stripped).
provider-size = "build -p ice-rpc --example provider-app --features tokio --profile size"

consumer = "run -p ice-rpc --example consumer-app --features tokio"
consumer-release = "run -p ice-rpc --release --example consumer-app --features tokio"
http-consumer = "run -p ice-rpc --example consumer-http-app --features tokio"

state = "run -p ice-rpc --example state_service --features tokio"

# `bench` is a Cargo built-in command and cannot be aliased: use `bench-app`.
bench-app = "run -p ice-rpc --release --example benchmark-app --features tokio"

probe = "run -p ice-rpc --example node_liveness_probe"
probe-release = "run -p ice-rpc --release --example node_liveness_probe"

# Out-of-band observer (`ice-rpc-monitor`). Extra flags go after `--`, e.g.
#   cargo monitoring-detail -- --channel DatabaseService
monitoring = "run -p ice-rpc-monitor --example console-monitor"
monitoring-detail = "run -p ice-rpc-monitor --example console-monitor -- --detail"
monitoring-demo = "run -p ice-rpc-monitor --example console-monitor -- --demo --detail"
monitoring-serve = "run -p ice-rpc-monitor"
