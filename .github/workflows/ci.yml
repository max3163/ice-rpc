name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      # The Node.js gateway is excluded: it requires the N-API/Node toolchain.
      # `tokio,http-tokio,json` covers the tokio execution mode, the HTTP
      # gateway on its tokio adapter and the JSON host codegen. `json` matters
      # here precisely because the gateway is excluded: it is the only consumer
      # of the generated converters, so without it that code would not be
      # compiled anywhere in this job.
      # `http-tokio` rather than `http`: the gateway needs one adapter per mode,
      # and the manifest refuses to pick one on its own.
      - name: Check (workspace, excluding the Node.js gateway)
        run: cargo check --workspace --exclude gateway-nodejs --all-targets --features tokio,http-tokio,json,tracing

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --exclude gateway-nodejs --all-targets --features tokio,http-tokio,json,tracing -- -D warnings

      # The default workspace run exercises the `rt-threads` mode, the fallback
      # facade (an `async-executor` instance on OS threads, `futures-timer` for
      # the timers, `blocking` for the pool).
      - name: Test (workspace, default mode)
        run: cargo test --workspace --exclude gateway-nodejs

      # One full mode per host runtime. The facade, and the operators that need
      # it (`delay`, `timeout`, `subscribe`), live in `ice-rpc-rx`, which drives
      # itself through `rt::test_block_on`; `ice-rpc` is tested under the same
      # mode for the transport side. `--no-default-features` is what makes these
      # runs strict: without it the fallback mode is compiled too, and the point
      # of a mode is that a deployment can build one only.
      - name: Test (ice-rpc-rx, tokio mode)
        run: cargo test -p ice-rpc-rx --no-default-features --features tokio

      - name: Test (ice-rpc, tokio mode)
        run: cargo test -p ice-rpc --lib --no-default-features --features tokio

      - name: Test (ice-rpc-rx, smol mode)
        run: cargo test -p ice-rpc-rx --no-default-features --features smol

      - name: Test (ice-rpc, smol mode)
        run: cargo test -p ice-rpc --lib --no-default-features --features smol

      # A mode is only a mode if it brings *one* runtime: this step turns "full
      # tokio" and "full smol" from a documentation claim into a build property.
      # `-e normal` leaves the build dependencies out of the tree.
      - name: One runtime per mode (dependency purity)
        shell: bash
        run: |
          set -euo pipefail
          crates() {
            cargo tree -p ice-rpc --no-default-features --features "$1" -e normal \
              --prefix none --no-dedupe 2>/dev/null |
              sed 's/ (.*//' | awk '{print $1}' | sort -u
          }
          assert_absent() {
            if crates "$1" | grep -qx "$2"; then
              echo "::error::the $1 mode must not depend on $2"
              exit 1
            fi
          }
          # tokio mode: none of the smol lineage may follow the runtime in.
          for forbidden in smol async-executor blocking async-io futures-timer; do
            assert_absent tokio "$forbidden"
          done
          # smol mode: no tokio.
          assert_absent smol tokio
          # fallback mode: neither runtime, and no I/O reactor at all — the core
          # performs no async I/O, the transport blocks on its iceoryx2 WaitSet.
          for forbidden in tokio smol async-io; do
            assert_absent rt-threads "$forbidden"
          done
          # No `futures` facade in any mode: the only primitive the core needed
          # from it (the oneshot channel behind `rt::oneshot`) now comes from the
          # runtime-agnostic, dependency-free `oneshot` crate. Only napi — and
          # therefore the Node.js gateway, which this job excludes — still pulls
          # `futures` in.
          for mode in tokio smol rt-threads; do
            assert_absent "$mode" futures
          done
          echo "each mode carries exactly one runtime"

      # The `tracing` feature adds a dependency and a span per provider call,
      # and nothing else in the workspace turns it on: without this step a break
      # in it — an unresolved import, a lint on the feature-gated code — would go
      # unnoticed until a user enabled it. The coverage job runs with default
      # features on purpose, so it does not cover this either.
      - name: Test (ice-rpc, tracing feature)
        run: cargo test -p ice-rpc --features tracing --lib

  coverage:
    name: Coverage (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --workspace --exclude gateway-nodejs --exclude ice-rpc-macros-tests --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  # The Node.js gateway needs the N-API/Node toolchain, so the job above
  # excludes it. This one builds the addon and runs both halves of its contract:
  # the Rust units, the addon's surface with no bus, and a real round trip
  # carried by the IPC bus between two processes.
  gateway:
    name: Node.js gateway (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The napi CLI guards its artifact directory with a filesystem
      # reconciliation mechanism that renames `.swp` metadata files. Windows
      # Defender's real-time scan can touch one between its creation and the
      # rename, which leaves the lock held and times the build out after 120 s
      # (`Timed out ... waiting for filesystem reconciliation lock`). Excluding
      # the workspace from the scan removes that interference.
      - name: Exclude the workspace from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: gateway_nodejs/package-lock.json

      # `npm ci` needs the committed lockfile, which is why it is no longer
      # gitignored: without it a fresh clone cannot build the addon at all.
      # `--no-audit --no-fund` keeps the install to what it needs: the audit is
      # a registry round trip a CI run does not act on.
      - name: Install the addon build tooling
        run: npm ci --no-audit --no-fund
        working-directory: gateway_nodejs

      - name: Build the addon
        run: npm run build:debug
        working-directory: gateway_nodejs

      - name: Clippy (deny warnings)
        run: cargo clippy -p gateway-nodejs --all-targets -- -D warnings

      - name: Rust unit tests
        run: cargo test -p gateway-nodejs

      - name: Addon surface checks
        run: npm test
        working-directory: gateway_nodejs

      - name: Two-process round trip
        run: npm run test:e2e
        working-directory: gateway_nodejs
