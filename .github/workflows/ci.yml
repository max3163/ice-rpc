name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      # The Node.js gateway is excluded: it requires the N-API/Node toolchain.
      # `tokio,http,nodejs` covers the optional runtime adapter, the HTTP gateway
      # and the Node.js codegen. `nodejs` matters here precisely because the
      # gateway is excluded: it is the only consumer of the generated converters,
      # so without it that code would not be compiled anywhere in this job.
      - name: Check (workspace, excluding the Node.js gateway)
        run: cargo check --workspace --exclude gateway-nodejs --all-targets --features tokio,http,nodejs,tracing

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --exclude gateway-nodejs --all-targets --features tokio,http,nodejs,tracing -- -D warnings

      # The default workspace run exercises the agnostic runtime facade.
      - name: Test (workspace, default facade)
        run: cargo test --workspace --exclude gateway-nodejs

      # The `tokio` feature swaps the runtime facade: `rt::spawn` / `rt::sleep`
      # then require an active runtime. The `ice-rpc` unit tests supply one
      # through `rt::test_block_on`, so the tokio facade is exercised in CI too.
      - name: Test (ice-rpc, tokio facade)
        run: cargo test -p ice-rpc --features tokio --lib

      # The `tracing` feature adds a dependency and a span per provider call,
      # and nothing else in the workspace turns it on: without this step a break
      # in it — an unresolved import, a lint on the feature-gated code — would go
      # unnoticed until a user enabled it. The coverage job runs with default
      # features on purpose, so it does not cover this either.
      - name: Test (ice-rpc, tracing feature)
        run: cargo test -p ice-rpc --features tracing --lib

  coverage:
    name: Coverage (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --workspace --exclude gateway-nodejs --exclude ice-rpc-macros-tests --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
