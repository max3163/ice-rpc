# =============================================================================
# REACTIVE LAYER (ice-rpc-rx)
#
# The stream vocabulary, the operators, the multicast primitive and the
# execution facade. It has no dependency on iceoryx2, so its suite runs
# anywhere, and the `tokio` feature switches the facade it exercises.
# =============================================================================

[tasks.rx-test]
description = "Run the reactive layer tests (default mode: rt-threads)"
command = "cargo"
args = ["test", "-p", "ice-rpc-rx"]

# The mode runs are strict on purpose: `--no-default-features` is what proves a
# deployment can build one runtime without the fallback following it in.
[tasks.rx-test-tokio]
description = "Run the reactive layer tests in the tokio mode (strict)"
command = "cargo"
args = ["test", "-p", "ice-rpc-rx", "--no-default-features", "--features", "tokio"]

[tasks.rx-test-smol]
description = "Run the reactive layer tests in the smol mode (strict)"
command = "cargo"
args = ["test", "-p", "ice-rpc-rx", "--no-default-features", "--features", "smol"]

[tasks.rx-clippy]
description = "Lint the reactive layer, every target"
command = "cargo"
args = ["clippy", "-p", "ice-rpc-rx", "--all-targets"]

