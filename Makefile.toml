# =============================================================================
# Makefile.toml — cargo-make tasks for the ice-rpc + gateway_nodejs workspace
#
# Installation : cargo install cargo-make
# Usage :
#   cargo make info                     # Show the available tasks
#   cargo make build-all                # Compile everything (Rust + Node.js addon)
#   cargo make examples-build           # Build all Rust examples (debug)
#   cargo make examples-build-release   # Build all Rust examples (release)
#   cargo make provider                 # Run the Rust provider example (debug)
#   cargo make consumer                 # Run the Rust consumer example (debug)
#   cargo make provider-release         # Same, compiled in release
#   cargo make provider-context-nodejs  # Run the Node.js provider example
#
# Short Cargo aliases are available too (see `.cargo/config.toml`):
#   cargo provider | cargo consumer | cargo state | cargo probe
# =============================================================================

[env]
GATEWAY_DIR = "gateway_nodejs"
NODE = "node.exe"
# Bash executable. "bash" resolves through the PATH (Linux, macOS, Git Bash).
# On Windows cmd.exe, override with:
#   cargo make bench-load --env BASH="C:/Program Files/Git/bin/bash.exe"
BASH = "bash"

# --- Rust examples -----------------------------------------------------------
# The demo apps live in `ice-rpc-rx`; `ice-rpc/examples` only hosts the C7
# native-liveness diagnostic probe. Running an example needs its crate AND its
# features (see `required-features` in `ice-rpc-rx/Cargo.toml`):
#   - most examples            -> `tokio`
#   - `provider-app` + gateway -> `tokio http-tokio`
#   - `perf_probe`             -> `perf-probe` (opt-in, never built by default)
# Always run from the workspace root so the generated `config/iceoryx2.toml` is
# shared by the provider and the consumer.
EXAMPLES_CRATE = "ice-rpc-rx"
EXAMPLES_FEATURES = "tokio"
# Defaults for the generic `example` / `example-release` runners.
EXAMPLE = "provider-app"
EXAMPLE_FEATURES = "tokio"

# =============================================================================
# BUILD
# =============================================================================

[tasks.build-all]
description = "Compile all Rust crates and the Node.js addon"
dependencies = ["build-rust", "build-gateway"]

[tasks.build-rust]
description = "Compile all workspace crates"
command = "cargo"
args = ["build", "--workspace"]

[tasks.build-rust-release]
description = "Compile all workspace crates in release"
command = "cargo"
args = ["build", "--workspace", "--release"]

[tasks.build-gateway]
description = "Compile the NAPI-RS gateway-nodejs addon"
command = "npm"
args = ["run", "build"]
cwd = "${GATEWAY_DIR}"

[tasks.build-gateway-debug]
description = "Compile the NAPI-RS addon in debug mode"
command = "npm"
args = ["run", "build:debug"]
cwd = "${GATEWAY_DIR}"

# =============================================================================
# CHECK
# =============================================================================

[tasks.check-all]
description = "Check the compilation of the whole workspace (without producing binaries)"
command = "cargo"
args = ["check", "--workspace", "--all-targets"]

# =============================================================================
# RUST EXAMPLES
#
# Build (debug/release):
#   cargo make examples-build
#   cargo make examples-build-release
#
# Run a specific example generically (no shortcut below):
#   cargo make example         --env EXAMPLE=state_service
#   cargo make example-release --env EXAMPLE=benchmark-app
#   cargo make example-ice-rpc --env EXAMPLE=node_liveness_probe
#
# Pass example arguments after `--`:
#   cargo make consumer-rust -- --service database
# =============================================================================

# --- Short aliases (quickest way to run the demo pair) -----------------------
#   cargo make provider | consumer          (debug)
#   cargo make provider-release | consumer-release
#   cargo make bench-app                    (benchmark example, release)
#   cargo make probe -- list                (C7 liveness probe)
# The same shortcuts are available directly from Cargo via `.cargo/config.toml`
# (`cargo provider`, `cargo consumer`, `cargo probe`, ...).

[tasks.provider]
description = "Shortcut: run the Rust provider example (debug, features: tokio)"
workspace = false
command = "cargo"
args = ["run", "-p", "ice-rpc-rx", "--example", "provider-app", "--features", "tokio", "${@}"]
cwd = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}"

[tasks.consumer]
description = "Shortcut: run the Rust consumer example (debug, features: tokio)"
workspace = false
command = "cargo"
args = ["run", "-p", "ice-rpc-rx", "--example", "consumer-app", "--features", "tokio", "${@}"]
cwd = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}"

[tasks.provider-release]
description = "Shortcut: run the Rust provider example (release, features: tokio)"
workspace = false
command = "cargo"
args = ["run", "-p", "ice-rpc-rx", "--example", "provider-app", "--features", "tokio", "--release", "${@}"]
cwd = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}"

[tasks.consumer-release]
description = "Shortcut: run the Rust consumer example (release, features: tokio)"
workspace = false
command = "cargo"
args = ["run", "-p", "ice-rpc-rx", "--example", "consumer-app", "--features", "tokio", "--release", "${@}"]
cwd = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}"

