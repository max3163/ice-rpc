# =============================================================================
# MONITORING (ice-rpc-monitor)
#
# The out-of-band observer attaches to the channels a provider/consumer already
# exposes. Run it from the same directory as the observed processes so they
# resolve the same iceoryx2 root path.
#
#   cargo make monitoring            # console stats of every discovered channel
#   cargo make monitoring-detail     # + decoded request/response of every call
#   cargo make monitoring-demo       # self-contained: host + call DatabaseService
#   cargo make monitoring-demo-detail
#   cargo make monitoring-metrics    # observer binary, Prometheus endpoint on :9898
#   cargo make monitoring-test       # unit + end-to-end tests of the observer
#
# Extra arguments are forwarded after `--`:
#   cargo make monitoring-detail -- --channel DatabaseService --interval-ms 500
# =============================================================================

# --- Console observer --------------------------------------------------------

[tasks.monitoring]
description = "Run the console observer, stats only: [-- args]"
workspace = false
command = "cargo"
args = ["run", "-p", "ice-rpc-monitor", "--example", "console-monitor", "${@}"]
cwd = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}"

[tasks.monitoring-detail]
description = "Run the console observer in full mode (stats + decoded messages): [-- args]"
workspace = false
command = "cargo"
args = ["run", "-p", "ice-rpc-monitor", "--example", "console-monitor", "--", "--detail", "${@}"]
cwd = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}"

[tasks.monitoring-release]
description = "Run the console observer in full mode, release build: [-- args]"
workspace = false
command = "cargo"
args = ["run", "-p", "ice-rpc-monitor", "--example", "console-monitor", "--release", "--", "--detail", "${@}"]
cwd = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}"

