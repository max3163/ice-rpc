# Baseline iceoryx2 configuration for this package (its tests and examples).
#
# ice-rpc pins no service limit: publishers, subscribers, nodes, subscriber buffer
# size and loaned samples all come from here, so the deployment owns them. iceoryx2
# resolves this file relative to the process working directory — for `cargo test`
# and `cargo run` from this package, that is `ice-rpc/`, hence `config/iceoryx2.toml`.
#

[defaults.publish-subscribe]
max-publishers = 16
max-subscribers = 16
max-nodes = 32
subscriber-max-buffer-size = 1024
publisher-max-loaned-samples = 1024
# The compiled-in default is `static`, which makes a publisher's
# `initial_max_slice_len` a hard cap: a payload larger than it is refused at
# loan time (the transport turns that into an `RpcError`). `power-of-two` lets
# the publisher grow the sample instead, so a request larger than the channel's
# declared `max_slice_len` still travels — which is what the HttpService (up to
# 100 MB) and the benchmark workload rely on. See `ice-rpc/Readme.md`,
# section "Configuration".
publisher-allocation-strategy = "PowerOfTwo"
