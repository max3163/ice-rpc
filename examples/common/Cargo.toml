[package]
name = "common"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "Shared example services for ice-rpc (not published)"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[lib]
path = "src/mod.rs"

[features]
# The JSON view of these services, in one switch: the `impl JsonInvoker` the HTTP
# gateway dispatches to, the rkyv ↔ `serde_json::Value` converters, and the
# `ProviderJson` mode the Node.js bridge constructs.
#
# One name, and no transport in it: this crate cannot know which process will call
# its services — only the binary that opens an entry point does, and it enables
# this feature on this crate. The link step then drops the half that binary never
# reaches (`provide_json()` for a gateway, the invoker for an addon).
json = ["ice-rpc/json"]
# Emits the `{Service}Decoder`s and submits one link-time registration per
# service, so an out-of-band observer renders the payloads in clear text without
# this crate exposing a list (see `Decoders::linked()`).
monitoring = ["ice-rpc/monitoring"]

[dependencies]
# `#[ice_rpc::payload]` supplies the rkyv derives — and, when the `json` feature is
# on, the `serde` ones — and redirects their expansion to `ice_rpc::codegen`;
# `#[service]` injects the async-trait attribute through `ice_rpc::codegen` as
# well. This crate therefore needs neither `rkyv`, `serde`, `serde_json`, `log`
# nor `async-trait` of its own.
ice-rpc = { path = "../../ice-rpc" }
