[package]
name = "common"
version.workspace = true
rust-version.workspace = true
edition = "2021"
description = "Shared example services for ice-rpc (not published)"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[lib]
path = "src/mod.rs"

[features]
# The Node.js gateway consumes these services through the converters `#[service]`
# generates, so asking for `napi` is what asks for that code.
napi = ["ice-rpc/json"]
http = ["ice-rpc/http"]
# Emits the `{Service}Decoder`s and submits one link-time registration per
# service, so an out-of-band observer renders the payloads in clear text without
# this crate exposing a list (see `Decoders::linked()`).
monitoring = ["ice-rpc/monitoring"]

[dependencies]
ice-rpc = { path = "../../ice-rpc" }
log = { workspace = true }
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
