[package]
name = "common"
version = "0.1.0"
edition = "2021"
description = "Shared example services for ice-rpc (not published)"
license = "Apache-2.0"
publish = false

[lib]
path = "src/mod.rs"

[features]
napi = []
http = ["ice-rpc/http"]

[dependencies]
ice-rpc = { path = "../../ice-rpc" }
log = { workspace = true }
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
