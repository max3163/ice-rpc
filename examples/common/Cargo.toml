[package]
name = "common"
version = "0.1.0"
edition = "2021"
description = "Shared example services for ice-rpc (not published)"
license = "Apache-2.0"
publish = false

[lib]
path = "src/mod.rs"

[features]
napi = []
http = ["ice-rpc/http"]

[dependencies]
ice-rpc = { path = "../../ice-rpc" }
log = "0.4"
rkyv = { version = "0.8", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
async-trait = "0.1"
tokio = { version = "1.30", features = ["full"] }
