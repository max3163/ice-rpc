[package]
name = "common"
version.workspace = true
rust-version.workspace = true
edition = "2021"
description = "Shared example services for ice-rpc (not published)"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[lib]
path = "src/mod.rs"

[features]
# The Node.js gateway consumes these services through the converters `#[service]`
# generates, so asking for `napi` is what asks for that code.
napi = ["ice-rpc/nodejs"]
http = ["ice-rpc/http"]
# Exposes `decoders()`/`with_service_decoders!`: the generated `{Service}Decoder`s
# an out-of-band observer registers to render payloads in clear text.
monitoring = ["ice-rpc/monitoring"]

[dependencies]
ice-rpc = { path = "../../ice-rpc" }
log = { workspace = true }
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }