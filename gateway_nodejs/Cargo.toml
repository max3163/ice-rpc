[package]
name = "gateway-nodejs"
version.workspace = true
# The workspace floor (1.97, imposed by `trillium-http` 1.7.2 through the optional
# `http` features) already covers the 1.88 the napi family needs, so no local
# override is required.
rust-version.workspace = true
edition = "2024"
description = "Node.js napi gateway for ice-rpc"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[package.metadata.release]
pre-release-replacements = [
  { file = "package.json", search = '"version": "[0-9][^"]*"', replace = '"version": "{{version}}"', exactly = 1 },
  { file = "package-lock.json", search = '("name": "gateway-nodejs",\s*"version": ")[0-9][^"]*', replace = '${1}{{version}}', exactly = 2 },
]

[lib]
crate-type = ["cdylib"]

[dependencies]
# The reusable engine: the bridge, the lifecycle, the dispatch and the error
# codes all live there. This crate only names the services it serves. The version
# requirement lives in `[workspace.dependencies]`, so a bump updates it there.
ice-rpc-nodejs = { workspace = true }
# `napi` and `napi-derive` are declared directly because the `gateway!` macro
# emits `#[napi]` attributes and `::napi::…` paths, which resolve against the
# addon's own extern prelude. The engine re-exports both for everything else.
napi = { workspace = true }
napi-derive = { workspace = true }
# The example services this reference addon serves, with their JSON view on
# (`napi` -> `ice-rpc/json`), which every callable `#[service]` needs.
common = { path = "../examples/common", features = ["napi"] }

[build-dependencies]
napi-build = { workspace = true }
