[package]
name = "gateway-nodejs"
version.workspace = true
edition = "2021"
description = "Node.js napi gateway for ice-rpc"
license = "Apache-2.0"
publish = false

[package.metadata.release]
pre-release-replacements = [
  { file = "package.json", search = '"version": "[0-9][^"]*"', replace = '"version": "{{version}}"', exactly = 1 },
  { file = "package-lock.json", search = '("name": "gateway-nodejs",\s*"version": ")[0-9][^"]*', replace = '${1}{{version}}', exactly = 2 },
]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4", "napi8", "serde-json", "compat-mode"] }
napi-derive = "3"
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
ice-rpc = { path = "../ice-rpc" }
common = { path = "../examples/common", features = ["napi"] }

[build-dependencies]
napi-build = "2"
