[package]
name = "gateway-nodejs"
version = "0.1.0"
edition = "2021"
description = "Node.js napi gateway for ice-rpc"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4", "napi8", "serde-json", "compat-mode"] }
napi-derive = "3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
ice-rpc = { path = "../ice-rpc" }
common = { path = "../examples/common", features = ["napi"] }

[build-dependencies]
napi-build = "2"
