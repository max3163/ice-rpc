[package]
name = "ice-rpc-macros-tests"
version.workspace = true
rust-version.workspace = true
edition = "2021"
description = "Integration tests for the ice-rpc-macros procedural macros (not published)"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
# `monitoring` is requested here so the service decoders are always part of the
# graph: the generated rendering is asserted by `tests/decoder_rendering.rs`, and
# CI's workspace build enables the feature anyway through `ice-rpc-monitor`
# (feature unification), so pinning it makes isolated runs match CI.
#
# `json` is requested for the same reason, plus one of its own: the converters
# it generates are what the Node.js gateway calls, and until this test existed
# nothing executed them — they were only type-checked. It has no dependency of
# its own, unlike `http` + an adapter, which would pull the whole HTTP stack into
# every workspace test run; the `JsonInvoker` block is covered by CI's
# `--features tokio,http-tokio` job and by the gateway.
ice-rpc = { path = "../ice-rpc", features = ["monitoring", "json"] }
ice-rpc-macros = { path = "../ice-rpc-macros" }
async-trait = { workspace = true }
# The generated code serializes the request arguments to JSON (HTTP and Node.js
# entry points), so a service type implements the `serde` traits too.
serde = { workspace = true }
rkyv = { workspace = true }
bytecheck = "0.8"
log = { workspace = true }

[dev-dependencies]
trybuild = "1"
