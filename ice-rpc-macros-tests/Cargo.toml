[package]
name = "ice-rpc-macros-tests"
version.workspace = true
edition = "2021"
description = "Integration tests for the ice-rpc-macros procedural macros (not published)"
license = "Apache-2.0"
publish = false

[dependencies]
# The `cache` feature is required because the test suite exercises the
# `#[cache(ttl = "60s")]` attribute, which generates code referencing
# `ice_rpc::RpcCache`.
ice-rpc = { path = "../ice-rpc", features = ["cache"] }
ice-rpc-macros = { path = "../ice-rpc-macros" }
async-trait = { workspace = true }
rkyv = { workspace = true }
bytecheck = "0.8"
log = { workspace = true }

[dev-dependencies]
trybuild = "1"
