[package]
name = "ice-rpc-macros"
version.workspace = true
rust-version.workspace = true
edition = "2021"
description = "Procedural macros for ice-rpc: generates client, server, proxy and lifecycle from a #[service] trait"
license = "Apache-2.0"
repository = "https://github.com/max3163/ice-rpc"
homepage = "https://github.com/max3163/ice-rpc"
documentation = "https://docs.rs/ice-rpc-macros"
keywords = ["rpc", "ipc", "iceoryx", "macro", "rkyv"]
categories = ["development-tools::procedural-macro-helpers", "network-programming"]
readme = "Readme.md"

[lints]
workspace = true

[features]
# Opt-in: additionally generate the `{Service}Decoder` and the `impl Display for
# {Service}Request` used by an out-of-band observer. It is off by default so that
# plain providers and consumers carry no monitoring code — and, more importantly,
# are not forced to implement `Display` on every method argument and return type.
monitoring = []

# Opt-in: additionally generate the rkyv ↔ `serde_json::Value` converters and the
# `ProviderNodeJs` mode of the proxy. Only the Node.js gateway calls them, so a
# Rust-only deployment should not carry them (`ice-rpc`'s `nodejs` feature
# forwards this one).
nodejs = []

# Opt-in: additionally generate the `HttpCallable` implementation the HTTP
# gateway dispatches to. It is the block that keeps `serde_json`'s conversion
# machinery in a binary which never speaks HTTP, so it follows the same feature
# (`ice-rpc`'s `http` feature forwards this one).
http = []

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
log = { workspace = true }
quote = "1.0"
syn = { version = "3", features = ["full"] }

[dev-dependencies]
# The golden tests parse an expansion back and pretty-print it, so that the
# generated code is readable in a diff instead of being one enormous line.
# Version 0.3 is the one built on the same `syn` 3 as the generators: keeping
# both on one `syn` avoids a second, incompatible `syn::File` type in the graph.
prettyplease = "0.3"
