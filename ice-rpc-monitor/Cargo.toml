[package]
name = "ice-rpc-monitor"
version.workspace = true
rust-version.workspace = true
edition = "2021"
description = "Out-of-band observer for ice-rpc: Prometheus metrics and correlation-id traces"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[features]
default = []
# Per-process resources of the observed nodes (CPU, RSS, virtual memory, threads)
# through `sysinfo`. Off by default: a user who only wants the bus metrics does
# not pay for the OS inspection.
process-metrics = ["dep:sysinfo"]

[dependencies]
# Reuses `RpcHeader` and the transport service definition as the single source of
# truth for the wire contract.
ice-rpc = { path = "../ice-rpc" }
log = { workspace = true }
serde_json = { workspace = true }
# Clean termination detection (`SignalHandler::termination_requested`).
iceoryx2-bb-posix = "0.10.0"
# Same trade-off as in `ice-rpc`: the observer builds its filter from a plain
# level string, so `env_filter`'s regex engine (`regex` -> `regex-automata` +
# `aho-corasick` + `regex-syntax`) would be linked for nothing.
env_logger = { version = "0.11", default-features = false, features = [
    "auto-color",
    "humantime",
] }
# Optional: per-process resources of the observed nodes.
sysinfo = { version = "0.39", optional = true }

[dev-dependencies]
pollster = "1.0"
# The console example is linked against the shared service contract and decodes
# the observed payloads with the generated `{Service}Decoder`s.
common = { path = "../examples/common", features = ["monitoring"] }

[[bin]]
name = "ice-rpc-monitor"
path = "src/main.rs"
