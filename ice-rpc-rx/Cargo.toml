[package]
name = "ice-rpc-rx"
version.workspace = true
edition = "2021"
description = "Reactive operators (RxJS-like) for ice-rpc event streams"
license = "Apache-2.0"
publish = false

[features]
tokio = ["ice-rpc/tokio"]
http = ["ice-rpc/http"]
http-tokio = ["ice-rpc/http-tokio"]

[dependencies]
ice-rpc = { path = "../ice-rpc" }
futures-lite = "2"
pin-project-lite = "0.2"

[dev-dependencies]
env_logger = "0.11"
pollster = "1.0"
tokio = { workspace = true }
async-trait = { workspace = true }
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1"
log = { workspace = true }

[[example]]
name = "state_service"
required-features = ["tokio"]

[[example]]
name = "provider-app"
required-features = ["tokio"]

[[example]]
name = "consumer-app"
required-features = ["tokio"]

[[example]]
name = "consumer-http-app"
required-features = ["tokio"]

[[example]]
name = "benchmark-app"
required-features = ["tokio"]

[[example]]
name = "pipeline_bench"
required-features = ["tokio"]
