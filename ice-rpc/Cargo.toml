[package]
name = "ice-rpc"
version = "0.1.0"
edition = "2021"
description = "Zero-copy RPC over iceoryx2 with automatic reconnection, service discovery and HTTP gateway"
license = "Apache-2.0"
repository = "https://github.com/max3163/ice-rpc"
homepage = "https://github.com/max3163/ice-rpc"
documentation = "https://docs.rs/ice-rpc"
keywords = ["rpc", "ipc", "zerocopy", "iceoryx", "rkyv"]
categories = ["network-programming", "concurrency"]
readme = "Readme.md"
# The runtime-generated iceoryx2 config must not be shipped (machine-specific).
exclude = ["config/iceoryx2.toml"]

[package.metadata.docs.rs]
all-features = true

[features]
# The core is runtime-agnostic by default (async-global-executor + blocking +
# async-io). Optional features switch the execution facade to a dedicated
# runtime.
default = []
# The HTTP gateway is built on trillium (runtime-agnostic core). Its runtime
# adapter follows the selected runtime feature:
# - `tokio`             → trillium-tokio
# - `smol` / no feature → trillium-smol (async-global-executor)
http = ["dep:trillium", "dep:trillium-smol"]
tokio = ["dep:tokio", "dep:trillium-tokio"]
smol = ["dep:trillium-smol"]

[dependencies]
ice-rpc-macros = { path = "../ice-rpc-macros", version = "0.1.0" }
log = { workspace = true }
iceoryx2 = "0.9.3"
iceoryx2-bb-system-types = "0.9.3"
iceoryx2-bb-container = "0.9.3"
rkyv = { workspace = true }
async-trait = { workspace = true }
toml = "1.1"
thiserror = "2"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
# Runtime-agnostic primitives used by the core.
futures = "0.3"
futures-lite = "2"
futures-timer = "3"
async-channel = "2"
async-lock = "3"
async-global-executor = "3"
ctrlc = "3"
# Optional runtime adapters.
tokio = { workspace = true, optional = true }
# Optional runtime-agnostic HTTP gateway (trillium + runtime adapters).
trillium = { version = "1.4", optional = true }
trillium-smol = { version = "0.7", optional = true }
trillium-tokio = { version = "0.6", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
toml = "1.1"
futures = "0.3"
env_logger = "0.11"
pollster = "0.4"
# The examples still demonstrate a Tokio application; the core crate itself
# remains runtime-agnostic.
tokio = { workspace = true }
smol = "2"

[[example]]
name = "benchmark-app"
path = "examples/benchmark-app.rs"

[[example]]
name = "provider-app"
path = "examples/provider-app.rs"
# The provider service implementations use Tokio primitives
# (tokio::time::sleep, tokio::spawn), so the generated server handlers must
# run on the Tokio runtime. Run with: cargo run --example provider-app --features tokio
required-features = ["tokio"]

[[example]]
name = "consumer-app"
path = "examples/consumer-app.rs"

[[example]]
name = "consumer-http-app"
path = "examples/consumer-http-app.rs"
