[package]
name = "ice-rpc"
version.workspace = true
rust-version.workspace = true
edition = "2024"
description = "RPC over iceoryx2 shared memory: zero-copy header, rkyv payload, reconnection, discovery and more"
license = "Apache-2.0"
repository = "https://github.com/max3163/ice-rpc"
homepage = "https://github.com/max3163/ice-rpc"
documentation = "https://docs.rs/ice-rpc"
keywords = ["rpc", "ipc", "zerocopy", "iceoryx", "rkyv"]
categories = ["network-programming", "concurrency"]
readme = "Readme.md"
# An application-provided iceoryx2 config may sit here during local development;
# it is machine-specific and must not be shipped.
exclude = ["config/iceoryx2.toml"]

[lints]
workspace = true

[package.metadata.docs.rs]
# Deliberately not `all-features = true`: the execution modes are mutually
# exclusive (`tokio` + `smol` is a compile error, see `ice-rpc-rx::rt`), so the
# documented build picks one full mode and the adapter that belongs to it.
features = ["tokio", "http-tokio", "monitoring", "json", "tracing"]

[features]
# One full execution mode per host runtime, plus a fallback for a deployment
# that has none:
# - `rt-async` (default) — the crate's own executor on OS threads;
# - `tokio` — tokio only;
# - `smol` — smol only, sharing the global executor of the application.
# `ice-rpc-rx` owns the facade, so the choice is forwarded there: enabling
# `tokio` here switches the stream layer and the transport together, and a
# consumer never names the stream crate. The modes are exclusive (`tokio` +
# `smol` is a compile error). Enabling a mode does not remove the fallback from
# the dependency graph, because Cargo features are additive: a build with no
# residue of the other modes uses `default-features = false`.
default = ["rt-async", "operators"]
rt-async = ["ice-rpc-rx/rt-async"]
# The lightest client: `rt-none` (no pool, no async runtime) without the
# reactive operators. This is the build a pure blocking consumer selects:
# `default-features = false, features = ["client"]`.
client = ["ice-rpc-rx/rt-none"]
# The reactive operators, the `Subject` and the push-based `Subscription`. Off
# removes them (and their `rt::spawn`/`rt::sleep` usage) from the build; the
# wire, the `Observable` type and the blocking terminals stay.
operators = ["ice-rpc-rx/operators"]
tokio = ["dep:tokio", "ice-rpc-rx/tokio"]
smol = ["ice-rpc-rx/smol"]
# Generates, from `#[service]`, the `{Service}Decoder` and the `Display` impl an
# out-of-band observer uses to render the payloads. Off by default: a plain
# provider/consumer never calls that code. Rendering prefers a type's `Display`
# and falls back to its `Debug`, so a service type carries no formatting
# requirement of its own.
monitoring = ["ice-rpc-macros/monitoring", "dep:linkme"]
# Call tracing: the provider handler enters one `tracing` span per call, carrying
# the ids of the call (correlation, trace, span, parent, service, method), so the
# implementation's own `tracing` / `log` events are attached to the call without
# it writing anything.
#
# A **direct** (in-process) call made by a provider to one of its own services is
# traced too, and marked `kind = "local"` so a collector does not count an
# in-process delegation as a network hop. That envelope is built only when this
# feature is on: with it off the delegation is the plain `.await` it always was,
# with no context, no clock read and no allocation.
#
# Off by default: a deployment that collects no spans pays neither the dependency
# nor the span.
tracing = ["dep:tracing"]
# The JSON contract of a service, in **one** switch: the JSON view (`impl
# JsonInvoker`) a JSON transport dispatches to, the rkyv ↔ `serde_json::Value`
# converters, and the `ProviderJson` mode the Node.js bridge constructs.
#
# One switch rather than two because the *entry point* decides what is linked, not
# the feature: the converters and the JSON handlers are reachable only from
# `Proxy::provide_json()`, so a binary that never builds such a proxy — the HTTP
# gateway, a plain Rust provider — does not carry them even with this feature on.
# Separating "client" and "host" would move that decision back onto every crate
# that declares a service, which is exactly what a service cannot know.
#
# It also enables the `base64` dependency: a `Vec<u8>` argument travels as base64
# in both directions.
json = ["ice-rpc-macros/json", "dep:base64"]
# The HTTP gateway, one feature per runtime adapter. There is deliberately no
# standalone `http` feature: a gateway without an adapter cannot compile, so each
# name carries both the gateway and its adapter instead of diagnosing the missing
# half.
# - `http-threads` → trillium-smol on the fallback mode;
# - `http-smol`    → trillium-smol on smol, so the gateway shares the
#                    application's executor;
# - `http-tokio`   → trillium-tokio on tokio.
http-threads = ["json", "rt-async", "dep:trillium", "dep:trillium-smol"]
http-smol = ["json", "smol", "dep:trillium", "dep:trillium-smol"]
http-tokio = ["json", "tokio", "dep:trillium", "dep:trillium-tokio"]
# Not part of `full`: the Node.js gateway is a separate deployment (it links
# N-API), not another way of serving the same process. It enables `json`.
full = ["http-tokio", "operators"]

[dependencies]
# The reactive layer: the stream type, the operators, the multicast primitive
# and the execution facade. It knows nothing about the wire; this crate
# re-exports its items unchanged, at their historical paths.
# `default-features = false`: the fallback facade is a feature of its own
# (`rt-async`), so a deployment that picks `tokio` or `smol` can build without
# compiling it at all.
ice-rpc-rx = { workspace = true, default-features = false }
ice-rpc-macros = { workspace = true }
log = { workspace = true }
iceoryx2 = "0.10.0"
iceoryx2-bb-system-types = "0.10.0"
iceoryx2-bb-container = "0.10.0"
iceoryx2-bb-posix = "0.10.0"
rkyv = { workspace = true }
async-trait = { workspace = true }
tracing = { version = "0.1", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Optional, and reachable through `json` or `http`: the only code that names
# `base64` is the JSON converter `#[service]` generates for a `Vec<u8>` argument
# or field — the request builder under `json`, and the invoker both bridges
# dispatch to under `json` or `http`. It stays declared with `optional = true` so
# the `dep:` form in those features can name it, instead of exposing a `base64`
# feature of its own.
base64 = { workspace = true, optional = true }
# Pulled by the `monitoring` feature only: it is the linker-section machinery the
# generated decoder registrations are collected through.
linkme = { workspace = true, optional = true }
# Runtime-agnostic primitives used by the core. The stream layer keeps its own
# copy of the ones it needs (`ice-rpc-rx`); what is listed here is what the
# transport, the locator and the HTTP gateway use directly. Deliberately no
# `futures` facade: this crate only ever used it for a noop waker in tests (now
# `std::task::Waker::noop`) and for a `gen` re-export the codegen never named.
futures-lite = "2"
pin-project-lite = "0.2"
async-channel = "2"
async-lock = "3"
# Optional runtime adapter. Declared directly rather than through the workspace
# entry, whose `features = ["full"]` is meant for the demo binaries: the library
# needs `rt-multi-thread` (the runtime built by `#[ice_rpc::main(tokio)]`),
# `time` (`rt::sleep` on the tokio facade) and `rt` (`spawn`, `spawn_blocking`).
# An application that enables `http-tokio` gets the extra tokio features from
# trillium-tokio itself, which declares what it uses.
tokio = { version = "1.30", optional = true, features = ["rt", "rt-multi-thread", "time"] }
# Optional HTTP gateway (trillium + one runtime adapter per mode).
trillium = { version = "1.4", optional = true }
trillium-smol = { version = "0.7", optional = true }
trillium-tokio = { version = "0.6", optional = true }

[dev-dependencies]
# `default-features = false` drops `env_logger/regex` -> `env_filter/regex` ->
# `regex` -> `regex-automata` + `aho-corasick` + `regex-syntax`. The demos only
# ever build their filter from a plain level
# (`Env::default().default_filter_or("info")`), so that engine is dead weight:
# `cargo bloat` reported `regex_automata::meta::strategy::new` as the *largest*
# single function of `provider-app`, ~630 KiB of `.text` in total. Directives
# that need a regex (`RUST_LOG=/foo/`) are therefore unavailable in the demos;
# `RUST_LOG=info,ice_rpc=debug` keeps working, and `humantime` + `auto-color`
# are kept so the console output is unchanged.
env_logger = { version = "0.11", default-features = false, features = [
    "auto-color",
    "humantime",
] }
pollster = "1.0"
criterion = "0.8"
# The examples still demonstrate a Tokio application; the core crate itself
# remains runtime-agnostic.
tokio = { workspace = true }
smol = "2"
# The allocator A/B: the two demo binaries opt in with `#[global_allocator]`, so
# the measurement is a property of the **deployment**, never of the library.
# Dev-only, like the rest of the demos.
mimalloc = "0.1"
# `tracing-demo` reads the spans the `tracing` feature emits. Dev-only: the
# subscriber of a deployment is the deployment's business.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The demo services are declared once, in the `common` crate (not published), and
# shared with the `gateway_nodejs` examples: no local copy is maintained here.
common = { path = "../examples/common" }

[[bench]]
name = "concurrency"
harness = false

# Measures the cost of the boxed `Box<dyn Stream>` operator chain.
[[bench]]
name = "pipeline"
harness = false

# Measures the per-call costs the end-to-end load benchmark is too coarse to
# resolve: request buffer allocation, payload copy before decoding, clock read.
[[bench]]
name = "hot_path"
harness = false

# Prices the envelope that would give a **direct** (in-process) provider call a
# `CallContext` and a span, so the decision is taken on numbers.
[[bench]]
name = "local_call"
harness = false

# Prices the default `HashMap` hasher (SipHash) against the candidate custom
# hashers the transport's maps would use, on the key shapes they actually have
# (`u32` service ids, 16-byte correlation ids). See `benches/hash_map.rs`.
[[bench]]
name = "hash_map"
harness = false

# Prices `ipc_threadsafe`'s `MutexProtected` against `ipc`'s `SingleThreaded` on
# a real pub/sub port: it is the mutex cluster `perf` attributes to the provider,
# and the question is what switching the service flavour would actually buy.
# See `benches/iox_port_mutex.rs`.
[[bench]]
name = "iox_port_mutex"
harness = false

# Prices the payload hand-off of `handle_request`: the `to_vec()` that decouples
# the handler's lifetime from the sample pool, against decoding in place and
# against a recycled buffer. See `benches/handler_handoff.rs`.
[[bench]]
name = "handler_handoff"
harness = false

# Prices realistic request shapes (scalar, text, record, blob, many strings,
# table) across sizes, under three decoding strategies
# (`current_copy_then_decode`, `in_place_decode`, `access_zero_alloc`). The
# shapes that matter are the ones the `handler_handoff` bench misses: many
# variable fields (K allocations) and large blobs. See
# `benches/payload_shapes.rs`.
[[bench]]
name = "payload_shapes"
harness = false

# Prices the `serde_json::Value` tree the Node.js bridge builds and reads, on
# the payload shapes the services actually carry, against the rkyv decode and
# encode it accompanies. The bridge has no JSON text; this bench measures the
# intermediate tree, which is the most a napi-object fast path could remove.
# See `benches/json_value_cost.rs`.
[[bench]]
name = "json_value_cost"
harness = false

# ── Demo applications ───────────────────────────────────────────────
# Hosted here so a single crate ships the library, its examples and its benches.
# They all need the Tokio runtime facade,
# which the transport selects through the `tokio` feature; the reactive layer
# they use is re-exported from `ice-rpc-rx`.
[[example]]
name = "state_service"
required-features = ["tokio"]

[[example]]
name = "provider-app"
required-features = ["tokio"]

[[example]]
name = "consumer-app"
required-features = ["tokio"]

[[example]]
name = "consumer-http-app"
required-features = ["tokio"]

[[example]]
name = "benchmark-app"
required-features = ["tokio"]

# Remote cancellation: the caller drops its stream while the call is in flight,
# the provider abandons the work. Needs the async timer of the `tokio` facade.
[[example]]
name = "remote_cancel"
required-features = ["tokio"]

# Call tracing: one span per provider call, propagated across a hop. It is built
# only with the `tracing` feature — without it there is no span to show.
[[example]]
name = "tracing-demo"
required-features = ["tokio", "tracing"]

# The blocking consumer: a plain `fn main`, no async runtime. Built for the
# fallback `rt-async` mode, whose blocking primitives it demonstrates.
[[example]]
name = "blocking-consumer-app"
required-features = ["rt-async"]

# The Readme's Quick start, kept runnable: one service, its provider and its
# consumer in a single file, the two roles picked by a command-line argument.
[[example]]
name = "quickstart"
required-features = ["tokio"]
